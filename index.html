<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c4161f">
<title>Sartaroshxona</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --brand:#d4202f;--brand-d:#b3141f;--brand-l:#fdecee;--brand-g:linear-gradient(180deg,#e0303f 0%,#c4161f 100%);
    --bg:#fdeeef;--card:#fff1f2;--in:#fff;--text:#1d1b1c;--hint:#85797b;--line:#f1d0d4;
    --ok:#1f9d57;--ok-l:#e7f6ee;--warn:#d98a00;--warn-l:#fff4dc;--bad:#c4161f;--busy:#ece4e5;--gold:#f5a623;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);min-height:100vh;line-height:1.4;
    background:linear-gradient(180deg,#f7c4cb 0,#fbdde1 280px,#fdeeef 100%) no-repeat;background-color:var(--bg)}
  .wrap{max-width:980px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid #f6cfd4;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(180,20,31,.07);margin-bottom:14px}
  h1{font-size:21px;letter-spacing:-.2px} h2{font-size:17px;margin-bottom:12px} h3{font-size:16px}
  h2::before{content:"";display:inline-block;width:4px;height:16px;border-radius:2px;background:var(--brand);margin-right:8px;vertical-align:-2px}
  .hint{color:var(--hint);font-size:13px}
  label{display:block;font-size:13px;font-weight:500;color:var(--hint);margin:12px 0 5px}
  input,select{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;background:var(--in);color:var(--text);font-family:inherit;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(212,32,47,.12)}
 
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border:0;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.2px;cursor:pointer;white-space:nowrap;transition:transform .12s,box-shadow .15s,background .15s,filter .15s;user-select:none}
  .btn svg{width:18px;height:18px;flex:none}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn:focus-visible{outline:0;box-shadow:0 0 0 4px rgba(212,32,47,.25)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.block{width:100%;margin-top:14px}
  .btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:10px}
  .btn.primary{background:var(--brand-g);color:#fff;box-shadow:0 6px 16px rgba(212,32,47,.30),inset 0 1px 0 rgba(255,255,255,.22)}
  .btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn.success{background:linear-gradient(180deg,#2bb56b,#198a4c);color:#fff;box-shadow:0 6px 16px rgba(31,157,87,.28),inset 0 1px 0 rgba(255,255,255,.22)}
  .btn.success:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn.outline{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
  .btn.outline:hover{background:var(--brand-l)}
  .btn.ghost{background:#fff;color:#4a4345;box-shadow:inset 0 0 0 1.5px var(--line)}
  .btn.ghost:hover{background:#fff7f8}
  .btn.soft{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px #f2c3c9}
  .btn.soft:hover{background:var(--brand-l)}
  .btn.glass{background:rgba(255,255,255,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
  .btn.glass:hover{background:rgba(255,255,255,.28)}
  .link{background:none;border:0;color:var(--brand);padding:8px 2px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
  .link:hover{text-decoration:underline}
 
  .err{background:#fdecea;color:var(--bad);padding:11px 14px;border-radius:12px;font-size:14px;margin-top:14px;border:1px solid #f7cfcb}
  .okmsg{background:var(--ok-l);color:var(--ok);padding:11px 14px;border-radius:12px;font-size:14px;margin-bottom:14px;border:1px solid #c9ead8}
  .auth{max-width:420px;margin:24px auto}
  .brand{text-align:center;margin-bottom:18px}
  .brand .logo{width:64px;height:64px;border-radius:20px;background:var(--brand-g);color:#fff;font-size:30px;display:grid;place-items:center;margin:0 auto 12px;box-shadow:0 12px 26px rgba(212,32,47,.35)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fbd9de;padding:5px;border-radius:14px}
  .seg button{height:42px;border:0;border-radius:10px;background:transparent;color:#9a6a70;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  .seg button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.1)}
 
  .hero{background:var(--brand-g);color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:14px;box-shadow:0 12px 28px rgba(180,20,31,.32);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .hero .sub{font-size:13px;opacity:.9;margin-top:2px}
  .tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;height:44px;padding:0 18px;border:0;border-radius:12px;background:#fff;color:var(--brand);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(180,20,31,.1);transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .tabs button:hover{background:var(--brand-l)}
  .tabs button.on{background:var(--brand-g);color:#fff;box-shadow:0 6px 16px rgba(212,32,47,.32)}
  .badge{background:var(--brand);color:#fff;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;padding:0 6px}
  .tabs button.on .badge{background:#fff;color:var(--brand)}
 
  .srow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:10px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{height:34px;padding:0 14px;border:0;border-radius:20px;background:#fff;color:#7a5a5f;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
  .chip.on{background:var(--brand);color:#fff;box-shadow:none}
 
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
  .post{cursor:pointer;margin:0;transition:transform .15s,box-shadow .15s,border-color .15s}
  .post:hover{transform:translateY(-3px);border-color:#ee9aa3;box-shadow:0 14px 30px rgba(212,32,47,.16)}
  .post.static{cursor:default}.post.static:hover{transform:none;border-color:#f6cfd4;box-shadow:0 8px 24px rgba(180,20,31,.07)}
  .post p{font-size:14px;color:#6d6063;margin-top:4px}
  .ptop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
  .rline{margin:4px 0 6px;font-size:14px}
  .stars{color:var(--gold);letter-spacing:1px;font-size:16px}.stars i{color:#e6cfd2;font-style:normal}
  .tag{display:inline-block;background:#fff;color:var(--brand);font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;margin:2px 4px 2px 0;box-shadow:inset 0 0 0 1px #f2c3c9}
  .tag.me{background:var(--ok-l);color:var(--ok);box-shadow:none}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
  .pill.pending{background:var(--warn-l);color:var(--warn)}
  .pill.confirmed,.pill.done{background:var(--ok-l);color:var(--ok)}
  .pill.rejected,.pill.cancelled{background:#fdecea;color:var(--bad)}
  .manage{display:flex;gap:10px;margin-top:14px}
  .manage .btn{flex:1}
  .days{display:flex;flex-wrap:wrap;gap:8px}
  .days label{margin:0;display:flex;align-items:center;gap:7px;background:#fff;padding:0 14px;height:42px;border-radius:10px;color:var(--text);cursor:pointer;font-weight:500;border:1.5px solid var(--line)}
  .days label:has(input:checked){background:var(--brand-l);border-color:var(--brand);color:var(--brand)}
  .days input{width:auto;height:auto;accent-color:var(--brand)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sec{margin-top:18px;padding-top:6px;border-top:1px dashed #efbcc3}
  .locrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}

  .service-item{display:grid;grid-template-columns:1fr 120px auto;gap:8px;margin-bottom:8px;align-items:center}
  .service-check{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);margin-bottom:6px;cursor:pointer}
  .service-check input{width:auto;height:auto;accent-color:var(--brand)}
 
  .rate{display:inline-flex;gap:2px}
  .rate button{background:none;border:0;font-size:30px;line-height:1;color:#e6cfd2;cursor:pointer;padding:2px 3px;transition:transform .1s}
  .rate button.on{color:var(--gold)}
  .rate button:hover{transform:scale(1.15)}
 
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
  .cal{overflow-x:auto}
  table{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
  th{font-size:12px;color:var(--hint);font-weight:600;padding:4px}
  th b{display:block;font-size:15px;color:var(--text)}
  td.t{font-size:12px;color:var(--hint);text-align:right;padding-right:6px;white-space:nowrap}
  .cell{background:var(--ok-l);color:var(--ok);font-weight:600;transition:.12s}
  td.cell{height:40px;text-align:center;font-size:12px;border-radius:9px}
  .cell.free{cursor:pointer}
  .cell.free:hover{background:var(--ok);color:#fff}
  td.cell.closed{background:transparent}
  .cell.past{background:#f6e6e8;color:#c9b3b6;font-weight:400}
  .cell.busy{background:var(--busy);color:#8b8486}
  .cell.pend{background:var(--warn-l);color:var(--warn);box-shadow:inset 0 0 0 1.5px #f2d58e}
  .cell.conf,.cell.mine{background:var(--brand-g);color:#fff}
  .cell.conf{cursor:pointer}
  .cell.done{background:linear-gradient(180deg,#2bb56b,#198a4c);color:#fff}
  .cell.dayoff{background:#e2d9db;color:#706569;font-weight:500;cursor:default}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--hint);margin-top:12px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}
  .desk{display:block}.mob{display:none}
  .dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
  .dchip{border:0;border-radius:12px;background:#fff;color:#6d6063;padding:8px 0;font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
  .dchip b{display:block;font-size:16px;color:var(--text);margin-top:2px}
  .dchip.on{background:var(--brand-g);color:#fff;box-shadow:0 6px 14px rgba(212,32,47,.3)}.dchip.on b{color:#fff}
  .dchip.off{opacity:.35;cursor:default}
  .mslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mc{border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:2px;min-height:54px;justify-content:center}
  .mc b{font-size:15px}
 
  .modal{position:fixed;inset:0;background:rgba(40,8,12,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
  .modal .box{background:#fff5f6;border-radius:22px;padding:22px;width:100%;max-width:420px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
  .amount{text-align:center;margin:8px 0 14px}
  .amount b{display:block;font-size:30px;color:var(--brand);letter-spacing:-.5px}
  .amount span{font-size:13px;color:var(--hint)}
  .ccard{background:linear-gradient(135deg,#e0303f 0%,#a8111b 100%);border-radius:18px;padding:18px 18px 16px;color:#fff;box-shadow:0 14px 28px rgba(180,20,31,.35);position:relative;overflow:hidden}
  .ccard::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
  .ccard small{opacity:.8;font-size:11px;letter-spacing:1px;text-transform:uppercase}
  .ccard .num{font-size:21px;font-weight:600;letter-spacing:1.5px;margin:10px 0;font-variant-numeric:tabular-nums}
  .ccard .holder{font-size:14px;font-weight:500;opacity:.95;padding-right:100px}
  .copy{position:absolute;right:14px;bottom:12px;z-index:1;background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:8px;height:34px;padding:0 12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .copy:hover{background:rgba(255,255,255,.34)}
  .sum .r{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
  .sum .r:last-child{border:0}
  .sum .r span:first-child{color:var(--hint)}
  .list .it{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
  .list .it:last-child{border:0}
  .req{border:1.5px solid #f2d58e;background:#fffaf0;border-radius:16px;padding:16px;margin-bottom:12px}
  .req .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .req .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .req .acts .btn{flex:1;min-width:150px}
  .empty{text-align:center;color:var(--hint);padding:30px 10px}
  .empty b{color:var(--text);font-size:18px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:600}
  .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 1.5s infinite}
  @keyframes p{50%{opacity:.3}}
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#2a2325;color:#fff;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:92vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.ok{background:#177a45} #toast.bad{background:var(--bad)}
 
  @media(max-width:640px){
    .desk{display:none}.mob{display:block}
    .wrap{padding:10px 10px calc(24px + env(safe-area-inset-bottom))}
    .card{padding:15px;border-radius:16px}
    .hero{padding:14px;border-radius:18px}
    h1{font-size:19px}
    .srow{grid-template-columns:1fr}
    .srow .btn{width:100%}
    .row2{grid-template-columns:1fr;gap:0}
    .row2.keep{grid-template-columns:1fr 1fr;gap:10px}
    .manage{flex-direction:column}
    .req .acts .btn{min-width:100%}
    .modal{align-items:end;padding:0}
    .modal .box{border-radius:22px 22px 0 0;max-width:none;max-height:92vh;overflow:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
    .ccard .num{font-size:19px;letter-spacing:1px}
    .list .it{flex-direction:column;gap:6px}
    .list .it>div:last-child{text-align:left!important}
    .weeknav .btn{padding:0 10px}
    .days label{padding:0 11px}
    .service-item{grid-template-columns:1fr 100px auto}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
 
<script>
try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}
 
const SES = 'bs_session';
const API_URL = 'https://beckenduz.onrender.com/api/db';
const ADMIN_LOGIN = 'norboyevblog'; // Maxfiy admin logini
const ADMIN_PASS = '12213443';    // Admin paroli

const empty = () => ({ users: [], posts: {}, bookings: [], ratings: [], dayOffs: {}, favorites: {}, settings: { monthlyFee: 10000, adminCard: '8600000000000000', adminCardHolder: 'Admin' }, subRequests: [], expenses: 0 });
let CACHED_DB = empty();

async function loadAsync() {
  try {
    let res = await fetch(API_URL);
    if (!res.ok) return empty();
    let d = await res.json();
    d.users = d.users || [];
    d.posts = d.posts || {};
    d.bookings = d.bookings || [];
    d.ratings = d.ratings || [];
    d.dayOffs = d.dayOffs || {};
    d.favorites = d.favorites || {};
    d.settings = d.settings || { monthlyFee: 10000, adminCard: '8600000000000000', adminCardHolder: 'Admin' };
    d.subRequests = d.subRequests || [];
    d.expenses = d.expenses || 0;
    CACHED_DB = d;
    return d;
  } catch (e) {
    return CACHED_DB || empty();
  }
}

function load() { return CACHED_DB; }

async function saveAsync(db) {
  CACHED_DB = db;
  try {
    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: db })
    });
  } catch (e) {
    console.error("Baza saqlashda xatolik:", e);
  }
}

function save(db) { saveAsync(db); }
 
async function hash(s){
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  return 'p:'+s;
}
 
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const money=n=>Number(n).toLocaleString('ru-RU')+" so'm";
const DAYS=['Dush','Sesh','Chor','Pay','Jum','Shan','Yak'];
const normPhone=s=>s.replace(/\D/g,'');
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const fmtCard=s=>String(s||'').replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim();
const fmtDate=ds=>{const d=new Date(ds+'T00:00');return `${DAYS[(d.getDay()+6)%7]}, ${ds.slice(8)}.${ds.slice(5,7)}.${ds.slice(0,4)}`};
const STATUS={pending:'Tasdiqlash kutilmoqda',confirmed:'Tasdiqlandi',done:'Soch olindi ✅',rejected:"To'lanmagan",cancelled:'Bekor qilindi'};
const st=b=>b.status||'confirmed';
const active=b=>st(b)==='pending'||st(b)==='confirmed';
const deposit=b=>b.deposit??b.paid??b.price/2;
function weekStart(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return d}
function slotTimes(p){const out=[];for(let m=toMin(p.from);m+p.slot<=toMin(p.to);m+=p.slot)out.push(fromMin(m));return out}
 
const DISTRICTS={"Bektemir":[41.2096,69.3344],"Chilonzor":[41.2756,69.2035],"Mirobod":[41.2900,69.2850],"Mirzo Ulug'bek":[41.3370,69.3350],
  "Olmazor":[41.3520,69.2300],"Sergeli":[41.2260,69.2200],"Shayxontohur":[41.3280,69.2290],"Uchtepa":[41.2970,69.1630],
  "Yakkasaroy":[41.2886,69.2530],"Yashnobod":[41.2870,69.3320],"Yunusobod":[41.3680,69.2900],"Yangihayot":[41.2600,69.1500]};
function km(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function postPos(p){if(p.lat!=null&&p.lng!=null)return[p.lat,p.lng];return DISTRICTS[p.district]||null}

function isSubActive(p){
  if(!p) return false;
  if(p.isSuspended) return false;
  const until = p.subUntil || (Date.now() + 30*24*3600*1000);
  return until > Date.now();
}
 
const IC={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',

async function doRegister(){
  const phone=val('a_phone'), pass=val('a_pass');
  if(phone.length<9)return fail("Telefon raqamni to'g'ri kiriting");
  if(pass.length<6)return fail("Parol kamida 6 ta belgi bo'lishi kerak");
  const db=load();
  if(db.users.some(u=>u.login===phone))return fail("Bu telefon raqam allaqachon ro'yxatdan o'tgan!");
  
  const newUser = {login: phone, pass: await hash(pass), role: S.role, name: S.role==='sartarosh' ? 'Sartarosh' : 'Mijoz', phone: phone};
  db.users.push(newUser);
  save(db);
  S.mode='login'; S.err=null; S.msg="Muvaffaqiyatli ro'yxatdan o'tdingiz! Endi kiring."; render();
}

async function doLogin(){
  const loginInput=val('a_phone'), pass=val('a_pass');
  
  if(loginInput.toLowerCase() === ADMIN_LOGIN) {
    if(pass !== ADMIN_PASS) return fail("Telefon raqam yoki parol noto'g'ri");
    localStorage.setItem(SES, ADMIN_LOGIN);
    Object.assign(S, {user: {login: ADMIN_LOGIN, name: 'Admin', role: 'admin', phone: ADMIN_LOGIN}, tab: 'admin_stat', viewing: null, err: null, msg: null, draft: null, editing: false, week: 0, day: null, modal: null});
    render();
    return;
  }

  const db=load();
  const u=db.users.find(x=>x.login===loginInput || normPhone(x.login)===normPhone(loginInput));
  if(!u||u.pass!==await hash(pass))return fail("Telefon raqam yoki parol noto'g'ri");
  
  if(u.role !== S.role) {
    return fail(`Bu raqam "${u.role}" sifatida ro'yxatdan o'tgan. Rolni to'g'ri tanlang`);
  }

  localStorage.setItem(SES,u.login);
  Object.assign(S,{user:u,tab:u.role==='sartarosh'?'post':'all',viewing:null,err:null,msg:null,draft:null,editing:false,week:0,day:null,modal:null}); render();
}

function fail(m){S.err=m;S.msg=null;render()}
function logout(){localStorage.removeItem(SES);Object.assign(S,{user:null,viewing:null,modal:null,draft:null,editing:false,mode:'login',q:'',dist:'',sort:'rating',pos:null,onlyFav:false});render()}

function updateAdminSettings(){
  const fee = +val('admin_monthly_fee');
  const card = val('admin_card_num').replace(/\D/g,'');
  const holder = val('admin_card_holder');
  if(!fee || fee < 0) return toast("Oylik to'lovni to'g'ri kiriting", "bad");
  if(card.length !== 16) return toast("Karta raqami 16 ta bo'lishi kerak", "bad");
  
  const db = load();
  db.settings = db.settings || {};
  db.settings.monthlyFee = fee;
  db.settings.adminCard = card;
  db.settings.adminCardHolder = holder;
  save(db);
  toast("Admin sozlamalari saqlandi ✅", "ok");
  render();
}

function approveSubRequest(barberLogin){
  const db = load();
  db.posts = db.posts || {};
  if(db.posts[barberLogin]){
    const current = db.posts[barberLogin].subUntil && db.posts[barberLogin].subUntil > Date.now() ? db.posts[barberLogin].subUntil : Date.now();
    db.posts[barberLogin].subUntil = current + (30 * 24 * 3600 * 1000);
    db.posts[barberLogin].isSuspended = false;
  }
  db.subRequests = (db.subRequests || []).filter(r => r.barber !== barberLogin);
  save(db);
  toast("To'lov tasdiqlandi, e'lon 1 oyga ochildi ✅", "ok");
  render();
}

function rejectSubRequest(barberLogin){
  const db = load();
  db.subRequests = (db.subRequests || []).filter(r => r.barber !== barberLogin);
  save(db);
  toast("So'rov rad etildi (to'lanmagan)", "bad");
  render();
}

function adminAddCustomDays(login){
  const daysVal = +val('days_input_' + login);
  if(isNaN(daysVal)) return toast("Kun miqdorini to'g'ri kiriting", "bad");
  const db=load();
  if(!db.posts[login]) return;
  const current = db.posts[login].subUntil && db.posts[login].subUntil > Date.now() ? db.posts[login].subUntil : Date.now();
  db.posts[login].subUntil = current + (daysVal * 24 * 3600 * 1000);
  if(db.posts[login].subUntil > Date.now()) db.posts[login].isSuspended = false;
  save(db);
  toast(`Obuna vaqti ${daysVal > 0 ? '+' + daysVal : daysVal} kunga o'zgartirildi ✅`, 'ok');
  render();
}

function adminToggleSuspend(login){
  const db=load();
  if(!db.posts[login]) return;
  db.posts[login].isSuspended = !db.posts[login].isSuspended;
  save(db);
  toast(db.posts[login].isSuspended ? "E'lon vaqtincha yopildi" : "E'lon yoqildi ✅", 'ok');
  render();
}

function adminDeleteUser(login){
  if(!confirm("Bu foydalanuvchini o'chirasizmi?")) return;
  const db=load();
  db.users = db.users.filter(u => u.login !== login);
  delete db.posts[login];
  save(db);
  toast("Foydalanuvchi o'chirildi", "ok");
  render();
}

function adminDeletePost(login){
  if(!confirm("Bu e'lonni o'chirasizmi?")) return;
  const db=load();
  delete db.posts[login];
  save(db);
  toast("E'lon o'chirildi", "ok");
  render();
}

  save(db);

}

function readForm(){
  const base=S.draft||load().posts[S.user.login]||{};
  const serviceRows = document.querySelectorAll('#services_container .service-item');
  const services = [];
  serviceRows.forEach(row => {
    const name = row.querySelector('.srv-name')?.value.trim();
    const price = +row.querySelector('.srv-price')?.value;
    if(name && price > 0) services.push({name, price});
  });

  return {shop:val('p_shop'),address:val('p_addr'),phone:val('p_phone'),price:+val('p_price'),district:val('p_dist'),
    days:[...document.querySelectorAll('.p_day:checked')].map(x=>+x.value),from:val('p_from'),to:val('p_to'),slot:+val('p_slot'),
    card:val('p_card').replace(/\D/g,''),holder:val('p_holder'),lat:base.lat,lng:base.lng, 
    subUntil: base.subUntil || (Date.now() + 30*24*3600*1000),
    isSuspended: base.isSuspended || false,
    services: services.length ? services : [{name:'Soch kesish', price:+val('p_price')||50000}]};
}

function savePost(){
  const p=readForm();
  const bad=m=>{S.err=m;S.draft=p;render();};
  if(p.shop.length<2)return bad('Sartaroshxona nomini kiriting');
  if(!p.district)return bad('Tumanni tanlang');
  if(p.address.length<3)return bad('Manzilni kiriting');
  if(p.phone.length<3)return bad("Telefon raqamni to'g'ri kiriting");
  if(!(p.price>=1000))return bad("Xizmat narxini kiriting");
  if(!p.days.length)return bad('Kamida bitta ish kunini tanlang');
  if(!p.from||!p.to||toMin(p.to)-toMin(p.from)<p.slot)return bad("Ish vaqti noto'g'ri");
  if(p.card.length!==16)return bad("Karta raqami 16 ta raqamdan iborat bo'lishi kerak");
  if(p.holder.length<3)return bad('Karta egasining ismini kiriting');
  const db=load();
  db.posts[S.user.login]={...p, updated:Date.now()};
  save(db);
  S.err=null;S.draft=null;S.editing=false;S.msg="E'lon saqlandi ✅";
  render();
}
function editPost(){S.tab='post';S.viewing=null;S.editing=true;S.draft=null;S.err=null;S.msg=null;render()}
function cancelEdit(){S.editing=false;S.draft=null;S.err=null;render()}
function deletePost(){
  const login=S.user.login,db=load(),act=db.bookings.filter(b=>b.barber===login&&active(b));
  if(!confirm("E'loningizni o'chirasizmi?"))return;
  act.forEach(b=>{b.status='cancelled';b.reason='post_deleted'});
  delete db.posts[login];db.ratings=db.ratings.filter(r=>r.barber!==login);save(db);
  S.editing=false;S.draft=null;S.msg=null;S.viewing=null;toast("E'lon o'chirildi");render();
}
function locate(){
  if(!navigator.geolocation)return toast("Joylashuvni aniqlab bo'lmadi",'bad');
  const p=readForm();S.draft=p;
  navigator.geolocation.getCurrentPosition(pos=>{S.draft={...p,lat:+pos.coords.latitude.toFixed(5),lng:+pos.coords.longitude.toFixed(5)};toast('Joylashuv aniqlandi ✅','ok');render()},
    ()=>{toast("Joylashuvni aniqlab bo'lmadi.",'bad');render()},{timeout:9000,enableHighAccuracy:true});
}

function rating(db,login){const r=db.ratings.filter(x=>x.barber===login);return{n:r.length,avg:r.length?r.reduce((s,x)=>s+x.stars,0)/r.length:0}}
const starsHtml=avg=>{const n=Math.round(avg);return `<span class="stars">${'★'.repeat(n)}<i>${'★'.repeat(5-n)}</i></span>`};
const ratingLine=r=>r.n?`${starsHtml(r.avg)} <b>${r.avg.toFixed(1)}</b> <span class="hint">(${r.n} ta baho)</span>`:`<span class="hint">☆ Hali baholanmagan</span>`;
const rateInput=(barber,cur)=>`<span class="rate">${[1,2,3,4,5].map(n=>`<button class="${n<=cur?'on':''}" aria-label="${n} yulduz" onclick="rate('${esc(barber)}',${n})">★</button>`).join('')}</span>`;
const canRate=(db,client,barber)=>db.bookings.some(b=>b.client===client&&b.barber===barber&&st(b)==='done');
const myRating=(db,client,barber)=>db.ratings.find(x=>x.client===client&&x.barber===barber)?.stars||0;

function listItems(db){
  const q=S.q.trim().toLowerCase();
  let items=Object.entries(db.posts)
    .filter(([login, p]) => isSubActive(p))
    .map(([login,p])=>{
      const owner=db.users.find(u=>u.login===login),pos=postPos(p);
      return{login,p,owner,r:rating(db,login),d:(S.pos&&pos)?km(S.pos.lat,S.pos.lng,pos[0],pos[1]):null};
    });
  if(S.onlyFav && S.user){
    const favs = db.favorites?.[S.user.login] || [];
    items = items.filter(i => favs.includes(i.login));
  }
  if(S.dist)items=items.filter(i=>i.p.district===S.dist);
  if(q)items=items.filter(i=>[i.p.shop,i.p.address,i.p.district].join(' ').toLowerCase().includes(q));
  const byRating=(a,b)=>(b.r.avg-a.r.avg)||(b.r.n-a.r.n)||((b.p.updated||0)-(a.p.updated||0));
  if(S.sort==='near'&&S.pos)items.sort((a,b)=>((a.d??1e9)-(b.d??1e9))||byRating(a,b));
  else items.sort(byRating);
  return items;
}

      <button class="btn soft" onclick="nearMe()">${IC.pin}Menga yaqin</button></div>

  if(!items.length)return search+`<div class="card empty"><div style="font-size:44px">🔎</div><b>E'lon yo'q</b><br>${filtered?"Bu hududda e'lon topilmadi":"Hozircha faol e'lonlar yo'q."}</div>`;

    <div class="grid">${items.map((i,k)=>postCard(i,{top:!S.onlyFav&&S.sort==='rating'&&k===0&&i.r.n>0})).join('')}</div>`;

function detailView(login){

  if(!p || !isSubActive(p)){S.viewing=null;return allPosts()}
  const canBook=S.user.role==='mijoz',r=rating(db,login);
  const item={login,p,owner:db.users.find(u=>u.login===login),r,d:null};
  let rateBox='';
  if(S.user.role==='mijoz'){
    rateBox=canRate(db,S.user.login,login)
      ?`<div class="card"><h2>Sartaroshni baholang</h2>${rateInput(login,myRating(db,S.user.login,login))}</div>`
      :`<div class="card"><div class="hint">⭐ Baholash uchun avval shu sartaroshdan xizmat olishingiz kerak.</div></div>`;
  }
  return `<button class="link" onclick="S.viewing=null;render()">← Orqaga</button>
   ${postCard(item,{static:true})}
   <div class="card"><h2>Haftalik kalendar</h2>
    ${canBook?'<div class="hint" style="margin-bottom:10px">Bo\'sh vaqtni bosing — 50% to\'lovdan keyin tasdiqlanadi</div>':'<div class="hint" style="margin-bottom:10px">Faqat ko\'rish rejimi</div>'}
    ${calendar(login,canBook?'client':'view')}</div>${rateBox}`;
}
 
function cellOf(login,mode,bk,dm,ds,t,now, isDayOff){
  if(isDayOff) return {cls:'dayoff',label:'Dam olish'};
  const key=ds+'|'+t,b=bk[key],past=new Date(`${ds}T${t}`)<now;
  if(b){
    const pend=st(b)==='pending',first=b.clientPhone;
    if(mode==='barber')return pend?{cls:'pend',label:first,title:`${b.clientPhone}`}
      :{cls:'conf',label:first,title:`${b.clientPhone}`,click:`finish('${b.id}')`};
    if(b.client===S.user.login)return pend?{cls:'pend',label:'Kutilmoqda'}:{cls:'mine',label:'Sizniki'};
    return{cls:'busy',label:'Band'};
  }
  if(mode==='barber'&&dm[key]&&past)return{cls:'done',label:'✓ Bajarildi'};
  if(past)return{cls:'past',label:'–'};
  if(mode==='client')return{cls:'free',label:"Bo'sh",click:`askBook('${esc(login)}','${ds}','${t}')`};
  return{cls:'',label:"Bo'sh"};
}
function selDay(p){
  if(S.day!=null&&p.days.includes(S.day))return S.day;
  const today=(new Date().getDay()+6)%7,wd=[...p.days].sort((a,b)=>a-b);
  return S.week===0?(wd.find(x=>x>=today)??wd[0]):wd[0];
}
function calendar(login,mode){
  const db=load(),p=db.posts[login];
  if(!p)return `<div class="empty">E'lon yo'q</div>`;
  const ws=weekStart(S.week),dates=[...Array(7)].map((_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return d});
  const times=slotTimes(p),now=new Date(),sd=selDay(p);
  const bk={},dm={};
  db.bookings.filter(b=>b.barber===login).forEach(b=>{const k=b.date+'|'+b.time;if(active(b))bk[k]=b;else if(st(b)==='done')dm[k]=b});
  
  const dayOffs = db.dayOffs?.[login] || [];
  const attrs=c=>`${c.click?`onclick="${c.click}"`:''} ${c.title?`title="${esc(c.title)}"`:''}`;
  
  const rows=times.map(t=>`<tr><td class="t">${t}</td>${dates.map((d,i)=>{
    if(!p.days.includes(i))return `<td class="cell closed"></td>`;
    const dsStr = ymd(d);
    const isDayOff = dayOffs.includes(dsStr);
    const c=cellOf(login,mode,bk,dm,dsStr,t,now, isDayOff);
    return `<td class="cell ${c.cls}" ${attrs(c)}>${esc(c.label)}</td>`}).join('')}</tr>`).join('');
  
  const selDateStr = ymd(dates[sd]);
  const isSelDayOff = dayOffs.includes(selDateStr);
  const mslots=times.map(t=>{const c=cellOf(login,mode,bk,dm,selDateStr,t,now, isSelDayOff);
    return `<div class="mc cell ${c.cls}" ${attrs(c)}><b>${t}</b><span>${esc(c.label)}</span></div>`}).join('');
  
  const dayOffToggleBtn = mode==='barber' ? `<div style="margin-bottom:12px"><button class="btn ${isSelDayOff?'success':'ghost'} sm" onclick="toggleDayOff('${login}','${selDateStr}')">${isSelDayOff?'✅ Ish kuni qilish':'🏖 Dam olish kuni qilish'}</button></div>` : '';

  const nav=`<div class="weeknav"><button class="btn soft sm" onclick="S.week--;S.day=null;render()">‹ Oldingi</button>
    <b>${ws.getDate()}.${pad(ws.getMonth()+1)} – ${dates[6].getDate()}.${pad(dates[6].getMonth()+1)}</b>
    <button class="btn soft sm" onclick="S.week++;S.day=null;render()">Keyingi ›</button></div>`;
  return `${dayOffToggleBtn}${nav}
   <div class="desk"><div class="cal"><table><tr><th></th>${dates.map((d,i)=>`<th>${DAYS[i]}<b>${d.getDate()}</b></th>`).join('')}</tr>${rows}</table></div></div>
   <div class="mob"><div class="dchips">${dates.map((d,i)=>p.days.includes(i)
      ?`<button class="dchip ${i===sd?'on':''}" onclick="S.day=${i};render()">${DAYS[i]}<b>${d.getDate()}</b></button>`
      :`<button class="dchip off" disabled>${DAYS[i]}<b>${d.getDate()}</b></button>`).join('')}</div>
     <div class="mslots">${mslots}</div></div>`;
}

function toggleDayOff(login, dateStr){
  const db = load();
  db.dayOffs = db.dayOffs || {};
  db.dayOffs[login] = db.dayOffs[login] || [];
  const idx = db.dayOffs[login].indexOf(dateStr);
  if(idx > -1){ db.dayOffs[login].splice(idx, 1); toast("Ish kuni belgilandi", "ok"); }
  else { db.dayOffs[login].push(dateStr); toast("Dam olish kuni belgilandi 🏖", "ok"); }
  save(db); render();
}
 
function myCalendar(){
  const db=load(),login=S.user.login,p=db.posts[login];
  if(!p)return `<div class="card empty">E'lon yo'q.<br><br><button class="btn primary sm" onclick="setTab('post')">E'lon joylash</button></div>`;
  const mineB=db.bookings.filter(b=>b.barber===login);
  const pend=mineB.filter(b=>st(b)==='pending').sort((a,b)=>a.created-b.created);
  const conf=mineB.filter(b=>st(b)==='confirmed').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  
  const reqs=pend.length?`<div class="card"><h2>To'lovni tasdiqlash (${pend.length})</h2>
    ${pend.map(b=>`<div class="req"><div class="head">
       <div><b>${fmtDate(b.date)} · ${b.time}</b><br><span class="hint">📞 ${esc(b.clientPhone)}</span></div>
       <div style="text-align:right"><b style="font-size:18px;color:var(--brand)">${money(deposit(b))}</b></div></div>
       <div class="acts"><button class="btn success" onclick="decide('${b.id}','confirmed')">Tasdiqlash</button>
       <button class="btn outline" onclick="decide('${b.id}','rejected')">Rad etish</button></div></div>`).join('')}</div>`:'';
  
  return `${reqs}<div class="card"><h2>Mening kalendarim</h2>${calendar(login,'barber')}</div>
   <div class="card"><h2>Tasdiqlangan yozuvlar (${conf.length})</h2><div class="list">${conf.length?conf.map(b=>`<div class="it"><div><b>${fmtDate(b.date)} · ${b.time}</b><br><span class="hint">📞 ${esc(b.clientPhone)}</span><br>
      <button class="btn success sm" style="margin-top:8px" onclick="finish('${b.id}')">Soch olindi</button></div>
      <div style="text-align:right"><b>${money(b.price)}</b></div></div>`).join(''):'<div class="empty">Yozuvlar yo\'q</div>'}</div></div>`;
}
 
function decide(id,status){
  const db=load(),b=db.bookings.find(x=>x.id===id);if(!b||st(b)!=='pending')return render();
  b.status=status;b.decidedAt=Date.now();save(db);
  toast(status==='confirmed'?"Tasdiqlandi ✅":"Rad etildi",'ok');
  render();
}
function finish(id){
  const db=load(),b=db.bookings.find(x=>x.id===id);if(!b||st(b)!=='confirmed')return render();
  b.status='done';b.doneAt=Date.now();save(db);
  toast("Soch olindi ✅","ok");render();
}
 
function myBookings(){
  const db=load(),mine=db.bookings.filter(b=>b.client===S.user.login).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  return `<div class="card"><h2>Mening yozuvlarim</h2><div class="list">${mine.length?mine.map(b=>{const p=db.posts[b.barber],s=st(b);return `<div class="it"><div>
     <b>${fmtDate(b.date)} · ${b.time}</b><br><span class="hint">${esc(p?.shop||b.barber)}</span><br>
     <span class="pill ${s}" style="margin-top:6px">${STATUS[s]}</span>
     ${s==='pending'?`<button class="link" onclick="cancelBooking('${b.id}')">Bekor qilish</button>`:''}
     ${s==='done'&&p?`<div style="margin-top:8px"><span class="hint">Baholash:</span><br>${rateInput(b.barber,myRating(db,S.user.login,b.barber))}</div>`:''}</div>
     <div style="text-align:right"><b>${money(b.price)}</b></div></div>`}).join(''):'<div class="empty">Siz hali yozilmagansiz</div>'}</div></div>`;
}
function cancelBooking(id){
  if(!confirm("Bekor qilasizmi?"))return;
  const db=load(),b=db.bookings.find(x=>x.id===id);if(!b||st(b)!=='pending')return render();
  b.status='cancelled';save(db);toast('Bekor qilindi');render();
}
function rate(barber,n){
  const db=load();
  if(!S.user||S.user.role!=='mijoz'||!db.posts[barber]||!canRate(db,S.user.login,barber))return toast("Oldin xizmat olishingiz kerak",'bad');
  const ex=db.ratings.find(x=>x.client===S.user.login&&x.barber===barber);
  if(ex){ex.stars=n;ex.updated=Date.now()}else db.ratings.push({barber,client:S.user.login,stars:n,created:Date.now()});
  save(db);toast(`Rahmat! ${'★'.repeat(n)}`,'ok');render();
}

function toggleServiceSelect(idx){
  const p = load().posts[S.modal.barber];
  const srvList = p?.services || [{name:'Soch kesish', price:p.price}];
  const target = srvList[idx];
  const existIdx = S.selectedServices.findIndex(s => s.name === target.name);
  if(existIdx > -1) S.selectedServices.splice(existIdx, 1);
  else S.selectedServices.push(target);
  render();
}

function askBook(barber,date,time){
  const p=load().posts[barber];
  if(!p?.card){toast("Sartarosh karta kiritmagan",'bad');return}
  const srvList = p.services || [{name:'Soch kesish', price:p.price}];
  S.selectedServices = [srvList[0]];
  S.modal={barber,date,time};render();
}

function payModal(){
  const m=S.modal,p=load().posts[m.barber];if(!p){S.modal=null;return ''}
  const srvList = p.services || [{name:'Soch kesish', price:p.price}];
  const totalPrice = S.selectedServices.length ? S.selectedServices.reduce((sum, s) => sum + s.price, 0) : p.price;
  const depPrice = totalPrice / 2;

  return `<div class="modal" onclick="if(event.target===this){S.modal=null;render()}"><div class="box">
   <h2>To'lov (50%)</h2>
   <div style="max-height:140px;overflow-y:auto;margin-bottom:12px">
     ${srvList.map((srv, idx) => {
       const isChecked = S.selectedServices.some(s => s.name === srv.name);
       return `<div class="service-check" onclick="toggleServiceSelect(${idx})">
         <span>${esc(srv.name)} (${money(srv.price)})</span>
         <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation();toggleServiceSelect(${idx})">
       </div>`;
     }).join('')}
   </div>
   <div class="sum"><div class="r"><span>Sana</span><span>${fmtDate(m.date)}</span></div><div class="r"><span>Vaqt</span><span>${m.time}</span></div></div>
   <div class="amount"><span>O'tkazish kerak (50%)</span><b>${money(depPrice)}</b></div>
   <div class="ccard"><small>Karta</small><div class="num">${esc(fmtCard(p.card))}</div>
     <div class="holder">${esc(p.holder||'')}</div><button class="copy" onclick="copyCard('${esc(p.card)}')">Nusxalash</button></div>
   <button class="btn primary block" onclick="paid()">To'lab qo'ydim</button>
   <button class="btn ghost block" style="margin-top:10px" onclick="S.modal=null;render()">Bekor qilish</button></div></div>`;
}

function copyCard(c){
  try{navigator.clipboard.writeText(c).then(()=>toast('Karta nusxalandi ✅','ok'))}catch(e){}
}
function paid(){
  const m=S.modal,db=load(),p=db.posts[m.barber];
  if(!p){S.modal=null;return render()}
  if(db.bookings.some(b=>b.barber===m.barber&&b.date===m.date&&b.time===m.time&&active(b))){
    S.modal=null;toast("Bu vaqt band qilindi",'bad');return render();
  }
  const srvList = p.services || [{name:'Soch kesish', price:p.price}];
  const selServices = S.selectedServices.length ? S.selectedServices : [srvList[0]];
  const totalPrice = selServices.reduce((sum, s) => sum + s.price, 0);

  db.bookings.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),barber:m.barber,shop:p.shop,client:S.user.login,clientPhone:S.user.phone,
    date:m.date,time:m.time,price:totalPrice,deposit:totalPrice/2,selectedServices:selServices,status:'pending',created:Date.now()});
  save(db);S.modal=null;S.tab='mine';S.viewing=null;
  toast("So'rov yuborildi ⏳",'ok');
  render();
}
 
function render(){
  const keep={};['a_phone','a_pass','s_q','s_dist','admin_monthly_fee','admin_card_num','admin_card_holder','crm_expense_input','new_admin_pass'].forEach(id=>{if($(id))keep[id]=$(id).value});
  document.querySelectorAll('[id^="days_input_"]').forEach(el => { keep[el.id] = el.value; });

  $('app').innerHTML=S.user?appView():authView();
  Object.entries(keep).forEach(([id,v])=>{if($(id))$(id).value=v});
  lastPending=pendingCount();
}

async function initApp() {
  await loadAsync();
  S.user = currentUser();
  if (S.user && !S.tab) {
    if(S.user.login === ADMIN_LOGIN) S.tab = 'admin_stat';
    else S.tab = S.user.role === 'sartarosh' ? 'post' : 'all';
  }
  render();
}
initApp();
 
window.addEventListener('storage',e=>{
  if(e.key===SES){S.user=currentUser();if(!S.user){S.viewing=null;S.modal=null}else if(!S.tab){S.tab=S.user.login===ADMIN_LOGIN?'admin_stat':(S.user.role==='sartarosh'?'post':'all');}render();return}
});

setInterval(async ()=>{
  await loadAsync();
  if(S.user&&!S.modal&&!formOpen()&&document.activeElement?.id!=='s_q') {
    const n = pendingCount();
    if (n > lastPending) toast("🔔 Yangi to'lov so'rovi!", 'ok');
    render();
    lastPending = n;
  }
}, 5000);
</script>
</body>
</html>
